          cmake -S .. -B . -G Ninja -DCMAKE_BUILD_TYPE=$CMAKE_BUILD_TYPE -DCMAKE_POLICY_DEFAULT_CMP0167=OLD -DBOOST_ROOT=/usr/local -DBoost_NO_SYSTEM_PATHS=ON
          cmake --build . --parallel

          # Create release package
