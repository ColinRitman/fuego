name: Windows

on:
  push:
    tags:
      - "*"

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
        
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1
        
      - name: Download and Install Boost
        run: |
          $ErrorActionPreference = "Stop"
          
          # Create directory
          $BoostDir = "C:\thirdparties\boost-1.83.0"
          New-Item -ItemType Directory -Force -Path $BoostDir
          
          # Download pre-compiled Boost binaries
          $Url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.83.0/boost_1_83_0-msvc-14.3-64.exe"
          $InstallerPath = "C:\Users\runneradmin\AppData\Local\Temp\boost-installer.exe"
          Write-Host "Downloading Boost installer from $Url"
          curl -L $Url -o $InstallerPath
          
          # Install Boost silently
          Write-Host "Installing Boost to $BoostDir"
          Start-Process -Wait -FilePath $InstallerPath -ArgumentList "/SILENT", "/SP-", "/SUPPRESSMSGBOXES", "/DIR=$BoostDir"
          
          # Set environment variables
          $env:BOOST_ROOT = $BoostDir
          $env:BOOST_INCLUDE_DIR = "$BoostDir\include"
          
          # Find the correct library directory
          if (Test-Path "$BoostDir\lib64-msvc-14.3") {
            $env:BOOST_LIBRARY_DIR = "$BoostDir\lib64-msvc-14.3"
          } elseif (Test-Path "$BoostDir\lib") {
            $env:BOOST_LIBRARY_DIR = "$BoostDir\lib"
          } else {
            $env:BOOST_LIBRARY_DIR = "$BoostDir\stage\lib"
          }
          
          # Verify installation
          Write-Host "Checking Boost installation..."
          Write-Host "BOOST_ROOT: $env:BOOST_ROOT"
          Write-Host "BOOST_INCLUDE_DIR: $env:BOOST_INCLUDE_DIR"
          Write-Host "BOOST_LIBRARY_DIR: $env:BOOST_LIBRARY_DIR"
          
          if (Test-Path "$env:BOOST_ROOT\include") {
            Write-Host "Boost include directory found"
            Get-ChildItem "$env:BOOST_ROOT\include" | Select-Object -First 3
          } else {
            Write-Host "Boost include directory NOT found"
          }
          
          if (Test-Path "$env:BOOST_LIBRARY_DIR") {
            Write-Host "Boost library directory found"
            Get-ChildItem "$env:BOOST_LIBRARY_DIR" | Select-Object -First 3
          } else {
            Write-Host "Boost library directory NOT found"
          }

      - name: Build
        shell: powershell
        id: build
        run: |
          $build_folder = "build"
          $sha = "${{ github.sha }}"
          $xfg_ver = $sha.SubString(0,7)
          $release_name = "fuego-cli-win64-v$xfg_ver"
          
          mkdir "$build_folder"
          cd "$build_folder"
          
          # Configure with Boost paths
          Write-Host "Configuring CMake with Boost paths:"
          Write-Host "BOOST_ROOT: $env:BOOST_ROOT"
          Write-Host "BOOST_INCLUDE_DIR: $env:BOOST_INCLUDE_DIR"
          Write-Host "BOOST_LIBRARY_DIR: $env:BOOST_LIBRARY_DIR"
          
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DBOOST_INCLUDE_DIR="$env:BOOST_INCLUDE_DIR" `
            -DBOOST_LIBRARY_DIR="$env:BOOST_LIBRARY_DIR" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD `
            ..
          
          # Build with MSBuild
          msbuild fuegoX.sln /p:Configuration=Release /m /v:minimal
          
          # Package executables
          cd src\Release
          Compress-Archive -Path *.exe -DestinationPath "$release_name.zip"
          $sha256 = (Get-FileHash "$release_name.zip").Hash
          $asset_path = "./$build_folder/src/Release/$release_name.zip"
          
          echo "sha256=${sha256}" >> $env:GITHUB_OUTPUT
          echo "release_name=${release_name}.zip" >> $env:GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $env:GITHUB_OUTPUT
          echo "xfg_version=${xfg_ver}" >> $env:GITHUB_OUTPUT

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ${{ steps.build.outputs.asset_path }}
          name: Fuego CLI Suite v${{ steps.build.outputs.xfg_version }}
          body: |
            🪟 [Download for Windows](../../releases/download/${{ steps.build.outputs.xfg_version }}/${{ steps.build.outputs.release_name }}) **${{ steps.build.outputs.release_name }}**
            
            `SHA256 : ${{ steps.build.outputs.sha256 }}`
          append_body: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
