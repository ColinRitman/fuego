name: macOS

on:
  push:
    branches: [master, HEAT]
    tags-ignore:
      - "*"
  pull_request:
    branches: [master]

jobs:
  build:
    name: macOS (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13
            arch: x86_64
          - os: macos-14
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Cache Homebrew packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: ${{ runner.os }}-${{ matrix.arch }}-homebrew-${{ hashFiles('**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.arch }}-homebrew-

      - name: Install dependencies
        run: |
          brew update

          # Core build tools + deps
          brew install ninja cmake jsoncpp miniupnpc qrencode

          # Boost: prefer 1.86, fall back to 1.85
          brew install boost@1.86 2>/dev/null || brew install boost@1.85 2>/dev/null || true

          # ICU: handle versioned naming (Homebrew deprecated unversioned icu4c)
          brew install icu4c@77 2>/dev/null || brew install icu4c@76 2>/dev/null || brew install icu4c 2>/dev/null || true

          BREW=$(brew --prefix)

          # Detect Boost prefix
          for boost_ver in boost@1.86 boost@1.85 boost; do
            if [ -d "$BREW/opt/$boost_ver" ]; then
              echo "BOOST_ROOT=$BREW/opt/$boost_ver" >> $GITHUB_ENV
              echo "Found Boost at $BREW/opt/$boost_ver"
              break
            fi
          done

          # Detect ICU prefix
          for icu_ver in icu4c icu4c@77 icu4c@76; do
            if [ -d "$BREW/opt/$icu_ver" ]; then
              ICU_PREFIX="$BREW/opt/$icu_ver"
              echo "ICU_ROOT=$ICU_PREFIX" >> $GITHUB_ENV
              echo "PKG_CONFIG_PATH=$ICU_PREFIX/lib/pkgconfig:$PKG_CONFIG_PATH" >> $GITHUB_ENV
              echo "Found ICU at $ICU_PREFIX"
              break
            fi
          done

      - name: Configure
        run: |
          echo "BOOST_ROOT=$BOOST_ROOT"
          echo "ICU_ROOT=$ICU_ROOT"
          ls "$BOOST_ROOT/include/boost/version.hpp" 2>/dev/null && \
            grep BOOST_LIB_VERSION "$BOOST_ROOT/include/boost/version.hpp" || true
          ls "$ICU_ROOT/lib/"libicu*.dylib 2>/dev/null | head -5 || true

          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch }} \
            -DBOOST_ROOT="$BOOST_ROOT" \
            -DBOOST_INCLUDEDIR="$BOOST_ROOT/include" \
            -DBOOST_LIBRARYDIR="$BOOST_ROOT/lib" \
            -DBoost_NO_SYSTEM_PATHS=ON \
            -DICU_ROOT="$ICU_ROOT" \
            -DICU_INCLUDE_DIR="$ICU_ROOT/include" \
            -DCMAKE_PREFIX_PATH="$ICU_ROOT;$BOOST_ROOT" \
            -DCMAKE_POLICY_DEFAULT_CMP0167=OLD

      - name: Build
        run: cmake --build build --parallel

      - name: Package
        id: pkg
        run: |
          xfg_ver=${GITHUB_SHA::7}
          release_name="fuego-cli-macos-${{ matrix.arch }}-${xfg_ver}"
          mkdir "$release_name"
          for f in build/src/*; do
            [[ -x "$f" && -f "$f" ]] && strip "$f" && cp "$f" "$release_name/"
          done
          zip -r "${release_name}.zip" "$release_name"
          echo "release_name=${release_name}.zip" >> $GITHUB_OUTPUT
          echo "artifact_path=${release_name}" >> $GITHUB_OUTPUT

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pkg.outputs.release_name }}
          path: ${{ steps.pkg.outputs.artifact_path }}
