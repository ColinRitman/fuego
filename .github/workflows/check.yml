name: Build check

on:
  push:
    branches:
      - "**"
    tags-ignore:
      - "*" # We don't want this to run on release
  pull_request:

jobs:
  build-windows:
    name: Windows
    runs-on: windows-2022
    env:
      BOOST_ROOT: C:\thirdparties\boost-1.83.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v1.1

      - name: Download and Install Boost 1.83
        run: |
          $Url = "https://sourceforge.net/projects/boost/files/boost-binaries/1.83.0/boost_1_83_0-msvc-14.3-64.exe"
          $OutputPath = "C:\Users\runneradmin\AppData\Local\Temp\boost-installer.exe"
          curl -L $Url -o $OutputPath
          Start-Process -Wait -FilePath $OutputPath "/SILENT","/SP-","/SUPPRESSMSGBOXES","/DIR=C:\thirdparties\boost-1.83.0"

      - name: Build
        shell: powershell
        id: build
        run: |
          $build_folder = "build"
          $sha = "${{ github.sha }}"
          $xfg_ver = $sha.SubString(0,7)
          $release_name = "fuego-cli-win64-$xfg_ver"
          mkdir "$build_folder"
          cd "$build_folder"
          cmake -G "Visual Studio 17 2022" -A x64 `
            -DCMAKE_BUILD_TYPE=Release `
            -DBOOST_ROOT="$env:BOOST_ROOT" `
            -DBOOST_INCLUDE_DIRS="$env:BOOST_ROOT/include" `
            ..
          msbuild fuegoX.sln /p:Configuration=Release /m
          cd src\Release
          Compress-Archive -Path *.exe -DestinationPath "$release_name.zip"
          $sha256 = (Get-FileHash "$release_name.zip").Hash
          $asset_path = "./$build_folder/src/Release/$release_name.zip"
          mkdir "$release_name"
          cp *.exe "$release_name/"
          echo "sha256=${sha256}" >> $env:GITHUB_OUTPUT
          echo "release_name=${release_name}.zip" >> $env:GITHUB_OUTPUT
          echo "asset_path=${asset_path}" >> $env:GITHUB_OUTPUT
          echo "xfg_ver=${xfg_ver}" >> $env:GITHUB_OUTPUT
          echo "artifact_path=$build_folder/src/Release/$release_name" >> $env:GITHUB_OUTPUT

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: ${{ steps.build.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-mingw:
    name: MinGW
    runs-on: windows-2022
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            git
            base-devel
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare version
        shell: powershell
        id: setup
        run: |
          $xfg_ver="${{ github.sha }}".SubString(0,7)
          $release_name="fuego-cli-win64-mingw-$xfg_ver"
          echo "release_name=${release_name}" >> $env:GITHUB_OUTPUT

      - name: Build
        shell: msys2 {0}
        id: build
        run: |
          mkdir build
          cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release -DSTATIC=ON
          cmake --build . --config Release

      - name: Prepare release
        shell: msys2 {0}
        run: |
          mkdir build/fuego
          mv build/src/fuegod.exe build/fuego/ || true
          mv build/src/fuegoXd.exe build/fuego/ || true
          mv build/src/simplewallet.exe build/fuego/ || true
          mv build/src/walletd.exe build/fuego/ || true
          mv build/src/optimizer.exe build/fuego/ || true
          mv build/src/miner.exe build/fuego/ || true

      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.setup.outputs.release_name }}
          path: build/fuego
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu22:
    name: Ubuntu 22.04
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y libboost-all-dev libjsoncpp-dev
          build_folder="build/debug"
          xfg_ver=${GITHUB_SHA::7}
          xfg_ver_folder=$(echo $xfg_ver | sed 's/\.//g')
          release_name=fuego-cli-ubuntu-2204-dev"$xfg_ver"
          mkdir -p "$build_folder"
          cd "$build_folder"
          cmake -D ARCH=default -D CMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_CXX_FLAGS_DEBUG="-O3 -DNDEBUG" \
            -D CMAKE_POSITION_INDEPENDENT_CODE:BOOL=true \
            -D BOOST_IGNORE_SYSTEM_PATHS_DEFAULT=ON \
            -D BOOST_ROOT=/usr ../..
          make -j$(nproc)
          mkdir -p "$release_name"
          exeFiles=()
          for f in src/*; do [[ -x $f && -f $f ]] && exeFiles+=( "$f" ); done
          strip "${exeFiles[@]}"
          cp "${exeFiles[@]}" "$release_name/"
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "artifact_path=$build_folder/$release_name" >> $GITHUB_OUTPUT
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: ${{ steps.build.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-ubuntu24:
    name: Ubuntu 24.04
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Build
        id: build
        run: |
          set -e
          sudo apt-get update && sudo apt-get install -y libboost-all-dev libjsoncpp-dev
          build_folder="build/debug"
          xfg_ver=${GITHUB_SHA::7}
          xfg_ver_folder=$(echo $xfg_ver | sed 's/\.//g')
          release_name=fuego-cli-ubuntu-2404-dev"$xfg_ver"
          mkdir -p "$build_folder"
          cd "$build_folder"
          cmake -D ARCH=default -D CMAKE_BUILD_TYPE=Debug \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON \
            -DCMAKE_CXX_FLAGS_DEBUG="-O3 -DNDEBUG" \
            -D CMAKE_POSITION_INDEPENDENT_CODE:BOOL=true \
            -D BOOST_IGNORE_SYSTEM_PATHS_DEFAULT=ON \
            -D BOOST_ROOT=/usr ../..
          make -j$(nproc)
          mkdir -p "$release_name"
          exeFiles=()
          for f in src/*; do [[ -x $f && -f $f ]] && exeFiles+=( "$f" ); done
          strip "${exeFiles[@]}"
          cp "${exeFiles[@]}" "$release_name/"
          echo "release_name=${release_name}.tar.gz" >> $GITHUB_OUTPUT
          echo "artifact_path=$build_folder/$release_name" >> $GITHUB_OUTPUT
      - name: Upload To GH Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build.outputs.release_name }}
          path: ${{ steps.build.outputs.artifact_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build-macos:
      name: macOS
      runs-on: ${{ matrix.os }}
      strategy:
        matrix:
          include:
            - os: macos-13
              arch: intel
              arch_flag: x86_64
              boost_arch: x86
              platform_version: 13
            - os: macos-14
              arch: apple
              arch_flag: arm64
              boost_arch: aarch64
              platform_version: 14
      steps:
        - uses: actions/checkout@v4

        - name: Ensure Command Line Tools and update brew
          run: |
            sudo xcode-select --switch /Applications/Xcode.app/Contents/Developer || true
            brew update

        - name: Install dependencies with Homebrew
          run: |
            brew install cmake jsoncpp icu4c

        - name: Install Boost
          uses: MarkusJx/install-boost@v2
          id: install-boost
          with:
            boost_version: 1.86.0
            platform_version: ${{ matrix.platform_version }}
            toolset: clang
            arch: ${{ matrix.boost_arch }}

        - name: Build
          id: build
          env:
            BOOST_ROOT: ${{ steps.install-boost.outputs.BOOST_ROOT }}
          run: |
            export CC=clang
            export CXX=clang++
            build_folder="build/"
            xfg_ver=${GITHUB_SHA::7}
            release_name=fuego-cli-macos-${{ matrix.arch }}-dev"$xfg_ver"
            mkdir "$build_folder"
            cd "$build_folder"
            SDKROOT=$(xcrun --show-sdk-path)
            ICU_PREFIX=$(brew --prefix icu4c)
            # CMake configuration
            cmake -S .. -B . \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_OSX_SYSROOT="$SDKROOT" \
              -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch_flag }} \
              -DBOOST_ROOT="$BOOST_ROOT" \
              -DCMAKE_CXX_STANDARD=17 \
              -DCMAKE_CXX_FLAGS="-isysroot $SDKROOT -stdlib=libc++ -I$SDKROOT/usr/include -I$ICU_PREFIX/include" \
              -DCMAKE_C_FLAGS="-isysroot $SDKROOT"
            make -j$(sysctl -n hw.ncpu)
            mkdir "$release_name"
            exeFiles=()
            for f in src/*; do [[ -x $f && -f $f ]] && strip "$f" && exeFiles+=( "$f" ); done
            strip "${exeFiles[@]}"
            cp "${exeFiles[@]}" "$release_name/"
            zip -r "$release_name".zip "$release_name"
            sha256=$(shasum -a 256 "$release_name".zip | awk '{print toupper($1)}')
            artifact_path="$build_folder/$release_name"
            asset_path="./$build_folder$release_name.zip"
            echo "sha256=${sha256}" >> $GITHUB_OUTPUT
            echo "release_name=${release_name}.zip" >> $GITHUB_OUTPUT
            echo "asset_path=${asset_path}" >> $GITHUB_OUTPUT
            echo "xfg_version=${xfg_ver}" >> $GITHUB_OUTPUT
            echo "artifact_path=${artifact_path}" >> $GITHUB_OUTPUT

        - name: Upload To GH Artifacts
          uses: actions/upload-artifact@v4
          with:
            name: ${{ steps.build.outputs.release_name }}
            path: ${{ steps.build.outputs.artifact_path }}
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
