name: Build Fuego

on:
  push:
    branches: [ master, integrated-tesnet ]
  pull_request:
    branches: [ master, main ]

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        # Install Boost and other dependencies
        brew install boost cmake
        
    - name: Configure CMake
      run: |
        set -e
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_POLICY_DEFAULT_CMP0167=OLD ..
        
    - name: Build
      run: |
        set -e
        cd build
        make -j$(sysctl -n hw.ncpu)
        

  build-ubuntu-22:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libgtest-dev
        
    - name: Configure CMake
      run: |
        set -e
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_POLICY_DEFAULT_CMP0167=OLD ..
        
    - name: Build
      run: |
        set -e
        cd build
        make -j$(nproc)
        

  build-ubuntu-24:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        set -e
        sudo apt-get update
        sudo apt-get install -y build-essential cmake libboost-all-dev libssl-dev libgtest-dev
        
    - name: Configure CMake
      run: |
        set -e
        mkdir -p build
        cd build
        cmake -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_POLICY_DEFAULT_CMP0167=OLD ..
        
    - name: Build
      run: |
        set -e
        cd build
        make -j$(nproc)

  build-windows:
    runs-on: windows-2022
    env:
      BOOST_ROOT: C:\thirdparties\boost-1.83.0
    steps:
    - uses: actions/checkout@v4
    
    - name: Add msbuild to PATH
      uses: microsoft/setup-msbuild@v1.3
        
    - name: Download and Install Boost 1.83
      run: |
        $ErrorActionPreference = "Stop"
        $Url = "https://github.com/boostorg/boost/releases/download/boost-1.83.0/boost-1.83.0.zip"
        $OutputPath = "C:\Users\runneradmin\AppData\Local\Temp\boost-1.83.0.zip"
        $ExtractPath = "C:\thirdparties\boost-1.83.0"
        curl -L $Url -o $OutputPath
        Expand-Archive -Path $OutputPath -DestinationPath $ExtractPath -Force
        
    - name: Configure CMake
      run: |
        $ErrorActionPreference = "Stop"
        mkdir build
        cd build
        cmake -G "Visual Studio 17 2022" -A x64 -DBOOST_ROOT="$env:BOOST_ROOT" -DBOOST_INCLUDE_DIRS="$env:BOOST_ROOT/include" -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTS=OFF -DCMAKE_POLICY_DEFAULT_CMP0167=OLD ..
        if ($LASTEXITCODE -ne 0) { throw "CMake configuration failed" }
        
    - name: Build
      run: |
        $ErrorActionPreference = "Stop"
        cd build
        cmake --build . --config Release --parallel
        if ($LASTEXITCODE -ne 0) { throw "Build failed" }
        
